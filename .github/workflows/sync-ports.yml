name: sync ports

# Roll a palette or engine change through every published port.
#
# It opens a pull request in each port repository — never a direct push to main.
# That is deliberate: a regeneration is a change to what users install, and it
# gets read before it ships. A PR with an empty diff means that port was already
# in sync, which is the answer you want most of the time.
#
# Requires PORTS_TOKEN: a fine-grained token with contents:write and
# pull-requests:write on the sp-night port repositories.

# Not triggered by `release: published`. A release created with GITHUB_TOKEN does
# not raise events that start other workflows — GitHub blocks that to prevent
# loops — so the fan-out would sit waiting for something that never arrives.
# release.yml calls this workflow directly instead, which also fixes the ordering:
# publish, move the v1 tag, then regenerate.
on:
  workflow_call:
    inputs:
      only:
        description: Regenerate a single port (its registry slug). Empty means all of them.
        required: false
        type: string
      version:
        description: >-
          The engine version to pin each mapping to. release.yml passes the tag it
          just published. Empty leaves every pin untouched, which is what a
          regeneration that is not a release wants.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      only:
        description: Regenerate a single port (its registry slug). Empty means all of them.
        required: false
        type: string
      version:
        description: Pin each mapping to this engine version. Empty leaves the pins alone.
        required: false
        type: string
  # A catalogue change is a website change: the site builds a page per port out
  # of these two files, so listing a port here is what publishes it. Waiting for
  # the next release to carry it across would mean the page for a port that
  # already exists appears whenever the engine happens to ship.
  #
  # The fan-out is skipped on this path — see the `if` on `regenerate`. Editing
  # the catalogue does not change what any port's mapping resolves to, so
  # regenerating all of them would open a pull request per repository to say
  # nothing.
  push:
    branches: [main]
    paths:
      - registry/**

jobs:
  # The matrix comes from the catalogue, so a new port joins the fan-out by
  # being listed rather than by anyone editing this file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.list.outputs.ports }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          all=$(go run ./cmd/spn registry --json --registry registry/ports.yml --copy registry/copy.yml \
                 | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["slugs"]))')
          if [ -n "${ONLY}" ]; then
            if ! printf '%s' "$all" | grep -q "\"${ONLY}\""; then
              echo "::error::${ONLY} is not in the catalogue" >&2
              exit 1
            fi
            all="[\"${ONLY}\"]"
          fi
          echo "ports=$all" >> "$GITHUB_OUTPUT"
          echo "fanning out to $all"

  regenerate:
    needs: plan
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.plan.outputs.ports) }}
    steps:
      - name: the fan-out needs a token
        env:
          TOKEN: ${{ secrets.PORTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PORTS_TOKEN is empty. Set it as an organisation secret and" \
                 "grant this repository access to it — an org secret exists but is" \
                 "invisible to a repository that is not on its access list." >&2
            exit 1
          fi

      - name: check out the engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: check out the port
        uses: actions/checkout@v4
        with:
          repository: sp-night/${{ matrix.port }}
          path: port
          token: ${{ secrets.PORTS_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Built from this checkout rather than downloaded, so a release and the
      # fan-out it triggers cannot disagree about what the engine does.
      - name: build the engine
        working-directory: engine
        run: go build -o "$RUNNER_TEMP/spn" ./cmd/spn

      # The pin and the generated files are one fact: these files came out of
      # that engine. Bumping the pin in the same pull request is what keeps a
      # port's CI honest — it installs the pinned version and checks the files
      # against it, so the two can never be measured apart.
      - name: pin the engine this regeneration used
        if: ${{ inputs.version != '' }}
        working-directory: port
        run: '"$RUNNER_TEMP/spn" pin ${{ inputs.version }}'

      - name: regenerate
        working-directory: port
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/spn" lint
          "$RUNNER_TEMP/spn" gen --app ${{ matrix.port }}
          "$RUNNER_TEMP/spn" readme ${{ matrix.port }}
          "$RUNNER_TEMP/spn" preview ${{ matrix.port }}

      - name: open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: port
          token: ${{ secrets.PORTS_TOKEN }}
          branch: chore/regenerate-from-palette
          base: main
          commit-message: |
            chore(themes): regenerate from the palette

            Rolled through by the engine's fan-out. No hex was chosen here.
          title: "chore(themes): regenerate from the palette"
          body: |
            Regenerated from [`sp-night/sp-night`](https://github.com/sp-night/sp-night)
            at `${{ github.sha }}`${{ github.event.release.tag_name && format(' ({0})', github.event.release.tag_name) || '' }}.

            Every file here is derived: the theme files from
            [`${{ matrix.port }}`'s mapping](${{ matrix.port }}), the README and the
            previews from the port catalogue. If this diff contains something you
            did not expect, the mapping or the catalogue is what to change — not
            these files.

            An empty diff means this port was already in sync.
          labels: |
            generated
          delete-branch: true

  # The website vendors the contract so it can serve /palette.json and
  # /roles.json without depending on this repository at build time. That copy is
  # the one thing that can silently fall behind, so it gets the same treatment as
  # a port: a pull request when it no longer matches.
  #
  # It vendors the catalogue too, and draws the previews. The site builds a page
  # per port out of them, so a port listed here reaches the website with an
  # install guide, a key-to-role table and a screenshot rather than as a card
  # somebody still has to write.
  site:
    runs-on: ubuntu-latest
    steps:
      - name: the fan-out needs a token
        env:
          TOKEN: ${{ secrets.PORTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PORTS_TOKEN is empty. Set it as an organisation secret and" \
                 "grant this repository access to it — an org secret exists but is" \
                 "invisible to a repository that is not on its access list." >&2
            exit 1
          fi

      - name: check out the engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: check out the website
        uses: actions/checkout@v4
        with:
          repository: sp-night/sp-night.github.io
          path: site
          token: ${{ secrets.PORTS_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: copy the contract and the catalogue
        run: |
          set -euo pipefail
          cp engine/palette/sp_night.json site/src/data/palette.json
          cp engine/palette/roles.json    site/src/data/roles.json
          # The catalogue, whole. The site used to keep a reduced copy of it by
          # hand — nine of the fields, retyped — while the install guide, the
          # key-to-role table and the preview spec sat here unused.
          cp engine/registry/ports.yml    site/src/data/ports.yml
          cp engine/registry/copy.yml     site/src/data/copy.yml
          # The audit's own summary, so the site prints the floors and the pair
          # count the tool enforces rather than a table someone typed alongside
          # it. Generated, not part of the contract — hence produced here rather
          # than copied from palette/.
          (cd engine && go run ./cmd/spn check --json --palette palette) \
            > site/src/data/contrast.json
          if git -C site diff --quiet; then
            echo "the website's copy already matches the contract"
          fi

      # Drawn here rather than copied out of the port repositories, and that is
      # the load-bearing choice: a preview is derived from the catalogue and the
      # palette, both of which this job is copying in the same commit. Taking
      # the committed SVGs from each port's main instead would ship the site a
      # screenshot of the *previous* palette every time — the regenerate job
      # above only opens pull requests against those repositories, so their main
      # still holds the old colours while this runs.
      #
      # The slug list is derived here rather than taken from `plan`, which
      # narrows to one port when `only` is passed. The site vendors the whole
      # catalogue and asserts a preview exists for every entry in it, so a
      # single-port regeneration must still leave the website complete. It also
      # keeps this job independent of the fan-out: one port failing to
      # regenerate should not hold up the contract reaching the site.
      - name: draw the previews
        run: |
          set -euo pipefail
          # Absolute: --out is resolved by the tool, which runs with the engine
          # as its working directory. A relative path would land somewhere that
          # only looks right because of how deep the checkout happens to be.
          out="$(mktemp -d)"
          mkdir -p site/public/previews

          slugs=$(cd engine && go run ./cmd/spn registry --json \
                    --registry registry/ports.yml --copy registry/copy.yml \
                  | jq -r '.slugs[]')

          for slug in $slugs; do
            (cd engine && go run ./cmd/spn preview "$slug" \
              --palette palette --registry registry/ports.yml --copy registry/copy.yml \
              --out "$out/$slug")
            for f in "$out/$slug"/preview-*.svg; do
              flavour=$(basename "$f" .svg)
              cp "$f" "site/public/previews/$slug-${flavour#preview-}.svg"
            done
          done
          rm -rf "$out"

      # The website's own suite is the gate, and it checks this side of the
      # contract: the contrast policy, the no-raw-hex rule, that every role and
      # palette key a preview paints with resolves, and that a preview exists
      # for every port in the catalogue. A catalogue that has outrun the palette
      # must not reach the site even as a pull request. `build` is included
      # because the port pages are only rendered there.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: npm run check && npm test && npm run build

      - name: open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: site
          token: ${{ secrets.PORTS_TOKEN }}
          branch: chore/sync-the-contract
          base: main
          commit-message: |
            chore(data): sync the vendored contract and catalogue

            Copied from the engine, with the previews redrawn. The site remains
            the public URL of the contract, and builds a page per port out of
            the catalogue; this keeps both from falling behind.
          title: "chore(data): sync the vendored contract and catalogue"
          body: |
            The vendored copy in `src/data/` no longer matched
            [`sp-night/sp-night`](https://github.com/sp-night/sp-night)
            at `${{ github.sha }}`.

            If this adds an entry to `ports.yml`, merging it publishes that
            port's page at `/ports/<slug>`.

            `npm run check && npm test` passed against the new values before this
            was opened, so the contrast policy and the no-raw-hex rule still hold.

            An empty diff means the copy was already in sync.
          labels: |
            generated
          delete-branch: true
